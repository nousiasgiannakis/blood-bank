# ITE4120 course template — animals register.
# Production-shaped defaults; the `local` profile below (application-local.yml)
# switches on mock auth and the imitated owner registry.

server:
  port: ${ANIMALS_PORT:18440}

spring:
  application:
    name: ite4120-animals-register
  datasource:
    url: ${ANIMALS_DB_URL:jdbc:postgresql://localhost:18520/animals}
    username: ${ANIMALS_DB_USER:animals}
    password: ${ANIMALS_DB_PASSWORD:animals}
    hikari:
      # The pool's default session user — what the core.sys_columns() trigger stamps
      # into sys_created_by / sys_modified_by when nobody is signed in (Liquibase,
      # demo data, tests). Inside a request, JdbcConfig overrides it per connection
      # with the signed-in user via core.set_user().
      connection-init-sql: "select set_config('core.client_identifier', 'animals', false)"
  liquibase:
    change-log: classpath:animals/db/changelog/changelog.xml
    default-schema: animals
    liquibase-schema: public
    # The demo context seeds sample rows. Drop it to start empty.
    contexts: demo
    parameters:
      app-username: ${ANIMALS_DB_USER:animals}
      viewer-username: ${ANIMALS_DB_USER:animals}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Fail closed by default: no mock auth means every /api request is rejected.
auth:
  mock:
    enabled: false

animals:
  owner-registry:
    # http (default) — plain HTTPS+JSON against `url`; xroad — forge-xroad transport.
    mode: http
    url: http://localhost:18440/mock-registry
    # The built-in imitated registry; enabled only in the local profile.
    mock-server: false
