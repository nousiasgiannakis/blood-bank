name: Verify

# The "Verification before any PR" block of AGENTS.md, run by the machine on
# every pull request and on main — the same three gates, in the same words:
#
#   backend:  ./gradlew test          business tests + the migrations from empty
#                                     (Testcontainers on the runner's Docker)
#   frontend: npx tsc -b + vite build typecheck and a production build
#   db:       scripts/check-changesets formatted-SQL grammar and layout, fails closed
#
# Credentials. GitHub Packages refuses anonymous reads even for public packages,
# so both package managers get this workflow's own GITHUB_TOKEN: the Helex jars
# resolve from THIS repository's Maven mirror (public, like the repository) and
# the @helex-solutions npm packages are public per-package. A copy of this
# repository elsewhere works the same way; if its token cannot read the mirror,
# add a repository secret GPR_TOKEN (a classic PAT with read:packages, README
# § Tools › GitHub token) — it wins over GITHUB_TOKEN whenever it is set.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend · gradle test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: gradle test
        working-directory: backend
        env:
          # settings.gradle.kts reads exactly these two for every GitHub Packages repository.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GPR_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew test --console=plain
      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          if-no-files-found: ignore

  frontend:
    name: frontend · tsc + vite build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GPR_TOKEN || secrets.GITHUB_TOKEN }}
        # frontend/.npmrc maps the @helex-solutions scope to GitHub Packages; the
        # token for it goes into the runner's user-level npmrc, never into the repo.
        run: |
          printf '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' >> ~/.npmrc
          npm ci --no-audit --no-fund
      - name: npx tsc -b
        run: npx tsc -b
      - name: vite build
        run: npx vite build

  changesets:
    name: db · changeset grammar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: scripts/check-changesets
        run: python3 scripts/check_changesets.py
